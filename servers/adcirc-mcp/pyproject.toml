[project]
name = "adcirc-mcp"
version = "0.1.2"
description = "MCP server for ADCIRC model setup debugging, parameter lookup, and configuration validation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Mansur Ali Jisan", email = "mansur.jisan@noaa.gov"},
]
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0,<1",
    "pydantic>=2.0.0,<3",
]

[project.scripts]
adcirc-mcp = "adcirc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit the real ADCIRC wiki (deselect with '-m \"not integration\"')",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
]
