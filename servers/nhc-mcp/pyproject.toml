[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nhc-mcp"
version = "0.1.1"
description = "MCP server for NHC storm tracks, advisories, and hurricane best track data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Mansur Ali Jisan", email = "mansur.jisan@noaa.gov"},
]
keywords = [
    "mcp",
    "model-context-protocol",
    "noaa",
    "hurricane",
    "nhc",
    "tropical-cyclone",
    "storm-track",
    "hurdat2",
    "meteorology",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0,<1",
    "pydantic>=2.0.0,<3",
]

[project.urls]
Homepage = "https://github.com/oceanmodeling/ocean-mcp"
Repository = "https://github.com/oceanmodeling/ocean-mcp"
"Bug Tracker" = "https://github.com/oceanmodeling/ocean-mcp/issues"
Documentation = "https://github.com/oceanmodeling/ocean-mcp/tree/main/servers/nhc-mcp"
Changelog = "https://github.com/oceanmodeling/ocean-mcp/releases"

[project.scripts]
nhc-mcp = "nhc_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nhc_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit live NHC APIs (deselect with '-m \"not integration\"')",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "respx>=0.22.0"]
